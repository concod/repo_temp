{% include "header.html" %}
<div class="pagetitle">
	<h1>Bulk User Creation - <a href='static/samples/sample_bulk_user.csv'>Sample</a></h1>
</div>
<section class="section">
	<div class="row">
		<div class="col-lg-12">
			<div>
				{% for s in success %}
					<div class="alert alert-success bg-success text-light border-0 alert-dismissible fade show" role="alert">{{ s }}<button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button></div>
				{% endfor %}
			</div>
			<div>
				{% for e in errors %}
					<div class="alert alert-danger bg-danger text-light border-0 alert-dismissible fade show" role="alert">{{ e }}<button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button></div>
				{% endfor %}
			</div>
			<div class="col-lg-12">
				<form action="/bulkcreate" id="bulkcreate" method="post" enctype="multipart/form-data" onsubmit="add_loader();">
					<div class="col-sm-10">
						<input class="form-control" type="file" id="csvfile" name="csvfile">
					</div><br/>
					<button type="submit" class="btn btn-primary">Submit</button>
				</form>
			</div>
		</div>
	</div>
</section>
{% include "footer.html" %}
