# Define a template for the syncing steps
templates:
  - &data-sync-template
    runs-on:
      - self.hosted
      - linux.shell
      - mtp.database
    name: Data/Config Syncing
    caches:
      - pip
    script:
      - ./data_sync.sh

  - &clickhouse-sync-template
    runs-on:
      - self.hosted
      - linux.shell
      - mtp.database
    name: ClickHouse Data Syncing
    caches:
      - pip
    script:
      - ./clickhouse_sync.sh

  - &runner-template
    runs-on:
      - self.hosted
      - linux.shell
      - mtp.database

  - &db-sync-validate-template
    runs-on:
      - self.hosted
      - linux
      - docker
    name: Data/Config Syncing
    caches:
      - pip

definitions:
  services:
    docker:
      memory: 4096
  steps:
    - step: &security-scan
        name: Security Scan
        size: 2x
        script:
          # Run a security scan for sensitive data.
          # See more security tools at https://bitbucket.org/product/features/pipelines/integrations?&category=security
          - pipe: atlassian/git-secrets-scan:0.4.3

    - step: &validate-db-sync
        name: Validate data before db sync
        <<: *db-sync-validate-template
        script:
          - cd database
#          - python3.8 -m venv env
#          - source ./env/bin/activate
#          - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          - python3.8 run.py data_sync_check client env

pipelines:
  custom:
    test_data_sync:
      - variables:
        - name: CLIENT
          default: biglots
          allowed-values: *client-list
      - step:
          <<: *data-sync-template
          <<: *runner-template

    clickhouse_test_data_sync:
      - variables:
        - name: APPLICATION
          default: item_smart
          allowed-values: *application-list
        - name: CLIENT
          default: biglots
          allowed-values: *client-list
      - step:
          <<: *clickhouse-sync-template
          <<: *runner-template

    multi_client_data_sync_dropdown:
      - variables:
          - name: CLIENT_1
            default: biglots
            allowed-values: *client-list
          - name: CLIENT_2
            default: gap
            allowed-values: *client-list
          - name: CLIENT_3
            default: arhaus
            allowed-values: *client-list
          - name: CLIENT_4
            default: homedepot
            allowed-values: *client-list
          - name: CLIENT_5
            default: aritzia
            allowed-values: *client-list
      - step:
          <<: *data-sync-template
          name: Multiple Client Sync
          script:
            - >
              echo "Selected clients: $CLIENT_1 $CLIENT_2 $CLIENT_3 $CLIENT_4 $CLIENT_5" &&
              UNIQUE_CLIENTS=$(echo "$CLIENT_1 $CLIENT_2 $CLIENT_3 $CLIENT_4 $CLIENT_5" | tr ' ' '\n' | sort -u | tr '\n' ' ') &&
              echo "Distinct clients to sync: $UNIQUE_CLIENTS" &&
              echo "Starting parallel syncs..." &&
              for client in $UNIQUE_CLIENTS; do
                echo "Launching sync for $client";
                ( CLIENT="$client" ./data_sync.sh ) &
              done &&
              echo "Waiting for all syncs to finish..." &&
              wait &&
              echo "All syncs completed."


    test_data_sync_non_inventory:
      - variables:
        - name: CLIENT
          default: carters
          allowed-values: *replication-client-list
      - step:
          <<: *data-sync-template
          <<: *runner-template
          script:
            - REPLICATION_VALUE=non_inventory ./data_sync.sh
    
    test_data_sync_inventory:
      - variables:
        - name: CLIENT
          default: carters
          allowed-values: *replication-client-list
      - step:
          <<: *data-sync-template
          <<: *runner-template
          script:
            - REPLICATION_VALUE=inventory ./data_sync.sh

    complete_deploy:
      - variables:
        - name: CLIENT
          default: biglots
          allowed-values: *client-list
      - step:
          name: Build + Deploy
          <<: *runner-template
          script:
            - ./complete_deploy.sh

    complete_deploy_inventory:
      - variables:
        - name: CLIENT
          default: biglots
          allowed-values: *client-list
      - step:
          name: Build + Deploy
          <<: *runner-template
          script:
            - DEPLOYMENT_MODE=INVENTORY ./complete_deploy.sh

    complete_deploy_non_inventory:
      - variables:
        - name: CLIENT
          default: biglots
          allowed-values: *client-list
      - step:
          name: Build + Deploy
          <<: *runner-template
          script:
            - DEPLOYMENT_MODE=NON_INVENTORY ./complete_deploy.sh

    complete_deploy_replication:
      - variables:
        - name: CLIENT
          default: carters
          allowed-values: *replication-client-list
      - step:
          name: Build + Deploy
          <<: *runner-template
          script:
            - DEPLOYMENT_TARGET=REPLICATION DEPLOYMENT_MODE=NON_INVENTORY ./complete_deploy.sh
            - DEPLOYMENT_MODE=INVENTORY ./complete_deploy.sh
