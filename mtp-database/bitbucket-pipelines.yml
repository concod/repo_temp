    cross_schema_validation:
      - variables:
        - name: CLIENT
          default: carters
          allowed-values: *client-list-with-all
      - step:
          name: Cross_Schema_Validation
          <<: *runner-template
          script:
            - |
              if [ "$CLIENT" = "ALL" ]; then
                echo "Scanning all clients in the repository..."
                python3 cross_schema_validation.py
              else
                echo "Scanning client: $CLIENT"
                python3 cross_schema_validation.py --client $CLIENT
              fi

  pull-requests:
    '**':
      - parallel:
          - step:
              name: Validate PR
              <<: *runner-template
              script:
                - ./validate_pr.sh
          - step:
              name: CSV Validator
              <<: *runner-template
              script:
                - python3 database/pipeline_csv_validator_entrypoint.py

  branches:
    develop/test:
      - step:
          name: Auto Deploy
          <<: *runner-template
          script:
            - ./auto_deploy.sh
