{% set new_relic_config = (new_relic is defined and new_relic | bool) | default(false) | ternary("NEW_RELIC_CONFIG_FILE=/opt/repo/" ~  job_type ~ "/" ~  environ ~ "/newrelic.ini newrelic-admin run-program", '') %}
[program:{{ environ }}-{{ job_type }}]
stopasgroup=true
stopsignal=QUIT
autostart = true
autorestart = true
directory={{ base_repo_path }}{{ job_type }}/{{ environ }}/
command = /bin/bash -c "source /opt/envs/{{ job_type }}/{{ environ }}/bin/activate && SECRET_PROJECT_ID=ia-securearmor PROJECT_ID=mtp ENV=test python3.8 app.py"
environment=env={{ environ }}
stdout_logfile = /var/log/{{ job_type }}/stdout-{{ environ }}-{{ job_type }}.log
stderr_logfile = /var/log/{{ job_type }}/stderr-{{ environ }}-{{ job_type }}.log
startretries = 3
user = root