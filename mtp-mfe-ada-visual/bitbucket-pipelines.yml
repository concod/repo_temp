definitions:
  services:
    docker:
      memory: 4096
  caches:
  steps:
    - step: &security-scan
        runs-on:
          - self.hosted
          - linux
          - docker
        name: Security Scan
        script:
          # Run a security scan for sensitive data.
          # See more security tools at https://bitbucket.org/product/features/pipelines/integrations?&category=security
          - pipe: atlassian/git-secrets-scan:0.4.3

# Workflow Configuration

pipelines:
  branches:
    develop/dev:
      - step:
          name: Run AWX job
          runs-on:
            - self.hosted
            - linux
            - docker
          script:
            - python3 -m pip install requests==2.28.1
            - python3 deploy-cloudrun.py $awx_username $awx_password iss-core-dev frontend ver
    develop/test:
      - step:
          name: Run AWX job
          runs-on:
            - self.hosted
            - linux
            - docker
          script:
            - python3 -m pip install requests==2.28.1
            - python3 deploy-cloudrun.py $awx_username $awx_password iss-core-test frontend ver
  custom:
    scan:

  pull-requests:
    main:
    develop/dev:
