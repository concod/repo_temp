    - step: &accuknox-sast
        name: Accuknox SAST
        size: 2x
        services: []
        script:
          - pipe: accu-knox/scan:3.0.0
            variables:
              SCAN_TYPE: SAST
              SOFT_FAIL: "true"
              ACCUKNOX_TOKEN: ${ACCUKNOX_TOKEN}
              ACCUKNOX_ENDPOINT: ${ACCUKNOX_ENDPOINT}
              ACCUKNOX_LABEL: ${ACCUKNOX_LABEL}

    - step: &accuknox-sbom
        name: AccuKnox SBOM Scan
        size: 2x
        services: []
        script:
          - pipe: accu-knox/scan:3.0.0
            variables:
              SCAN_TYPE: XBOM
              BOM_TYPE: sbom
              SCAN_PATH: "."
              PROJECT_NAME: inventorysmartfrontend
              PROJECT_CLASSIFIER: application
              ACCUKNOX_TOKEN: ${ACCUKNOX_TOKEN}
              ACCUKNOX_ENDPOINT: ${ACCUKNOX_ENDPOINT}
              ACCUKNOX_LABEL: ${ACCUKNOX_LABEL}

    - step: &awx-job-dev
        name: Run AWX job
        runs-on:
          - self.hosted
          - linux
          - docker
        script:
          - python3 -m pip install requests==2.28.1
          - python3 deploy-cloudrun.py $awx_username $awx_password mfe-iss-inventorysmart-dev fe ver

# Workflow Configuration

pipelines:
  branches:
    develop/*:
      - step: *awx-job-dev
      - step: *security-scan
      # - step: *scan-sonarcloud
      - step: *accuknox-sast
      - step: *accuknox-sbom
    main:
      - step: *security-scan
      # - step: *scan-sonarcloud
      - step: *accuknox-sast
      - step: *accuknox-sbom

  custom:
    develop/*:
      - step: *awx-job-dev
      - step: *security-scan
      # - step: *scan-sonarcloud
      - step: *accuknox-sast
      - step: *accuknox-sbom

    update-core-commit:
      - step:
          name: Update core submodule & raise PR
          runs-on:
            - self.hosted
            - linux
            - docker
          script:
            - bash frontend/scripts/update-core-and-raise-pr.sh $BITBUCKET_BRANCH

  pull-requests:
    "{feature/*,bugfix/*,hotfix/*,*}":
      - step: *security-scan
      # - step: *scan-sonarcloud-pr
      - step: *accuknox-sast
      - step: *accuknox-sbom
    develop/*:
      - step: *security-scan
      # - step: *scan-sonarcloud-pr
      - step: *accuknox-sast
      - step: *accuknox-sbom
    master:
      - step: *security-scan
      # - step: *scan-sonarcloud-pr
      - step: *accuknox-sast
      - step: *accuknox-sbom