repos:
-   repo: https://github.com/ambv/black
    rev: 23.1.0
    hooks:
    - id: black
      exclude: ^(migrations/|frontend/|scripts/)
      types: [python]
      verbose: true
-   repo: https://github.com/timothycrosley/isort
    rev: 5.12.0
    hooks:
    - id: isort
      exclude: ^(migrations/|frontend/|scripts/)
      types: [python]
      verbose: true
      args:
          - --profile
          - black
-   repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0-alpha.6
    hooks:
    - id: prettier
      files: ^(frontend/src/)